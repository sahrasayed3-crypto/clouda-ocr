[build-system]
requires = ["setuptools>=83,<84", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clouda-pdf"
version = "0.2.0"
description = "Arabic-first PDF-to-DOCX runtime with isolated data, training, and model subsystems."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.12"
dependencies = [
  "Pillow>=10.4.0",
  "pypdf>=4.3.1",
  "pypdfium2>=4.30.0",
  "python-docx>=1.1.2",
  "requests>=2.32.0"
]

[project.optional-dependencies]
server = [
  "fastapi>=0.139.2",
  "firebase-admin>=6.5.0,<7",
  "starlette>=1.3.1",
  "python-multipart>=0.0.32",
  "streamlit>=1.36.0",
  "uvicorn>=0.30.0"
]
worker = [
  "redis>=5.0.0",
  "rq>=2.0.0"
]
data = [
  "PyYAML==6.0.2",
  "defusedxml==0.7.1",
  "jsonschema==4.23.0"
]
factory = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "img2pdf>=0.5",
  "pikepdf>=9"
]
factory-render = [
  "WeasyPrint>=66,<70"
]
training = [
  "PyYAML==6.0.2",
  "jsonschema==4.23.0"
]
models = [
  "requests>=2.32.0"
]
test = [
  "fakeredis>=2.23.0",
  "httpx>=0.27.0",
  "pdfplumber>=0.11.0",
  "PyMuPDF>=1.24.0",
  "hypothesis>=6.161.0,<7",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0"
]
dev = [
  "bandit>=1.9.4,<2",
  "black>=24.0.0",
  "build>=1.2.2",
  "mypy>=1.10.0",
  "pip-audit>=2.10.1,<3",
  "ruff>=0.5.0"
]
security = [
  "bandit>=1.9.4,<2",
  "cyclonedx-bom>=7.3.1,<8",
  "detect-secrets>=1.5.0,<2",
  "pip-audit>=2.10.1,<3"
]

[project.scripts]
clouda-data = "clouda_data.pipeline.cli:main"
clouda-lab = "clouda_lab.cli:main"
clouda-training = "clouda_training.cli:main"
clouda-quality = "clouda_data.quality.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "pdfword*",
  "clouda_contracts*",
  "clouda_data*",
  "clouda_lab*",
  "clouda_models*",
  "clouda_training*"
]
exclude = ["tests*"]

[tool.setuptools.package-data]
pdfword = [
  "streamlit_firebase_auth/index.html"
]
clouda_data = [
  "resources/*.json",
  "resources/data_factory/*.yaml",
  "resources/distortions/*.json",
  "resources/distortions/*.yaml",
  "resources/fonts/*.ttf",
  "resources/schemas/*.json"
]
[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "^/\\.private/"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
  "audit_backups",
  "backups",
  "conversions",
  "data",
  "outputs",
  "samples/generated"
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Vendored RAQM render stack (byte-parity with the legacy engine): imports are
# intentionally placed after logger setup to preserve the original structure.
"clouda_data/factory/render/_raqm/*" = ["E402"]

[tool.bandit]
targets = ["pdfword", "tools", "scripts"]
exclude_dirs = [
  "tools/poppler",
  "tools/python",
  "tools/tesseract",
  'tools\poppler',
  'tools\python',
  'tools\tesseract'
]
skips = ["B608", "B310", "B615"]

[tool.coverage.run]
branch = true
source = [
  "pdfword",
  "clouda_contracts",
  "clouda_data",
  "clouda_models",
  "clouda_training"
]

[tool.coverage.report]
show_missing = true
